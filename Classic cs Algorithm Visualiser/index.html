<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Classic CS Algorithm Visualizer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #000;;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    h1 {
      margin-bottom: 30px;
      font-size: 2.5em;
      color: white;
    }

    .container {
      display: flex;
      justify-content: center;
      gap: 40px;
      flex-wrap: wrap;
      width: 90%;
      max-width: 1200px;
    }

    .feature-box {
      position: relative;
      width: 45%;
      height: 300px;
      background-size: cover;
      background-position: center;
      border-radius: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
      overflow: hidden;
      transition: transform 0.3s ease;
    }

    .feature-box:hover {
      transform: scale(1.03);
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      text-align: center;
      padding: 20px;
    }

    .overlay h2 {
      font-size: 2em;
      margin-bottom: 20px;
    }

    .overlay button {
      padding: 12px 25px;
      font-size: 1em;
      background-color: #ff9800;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: #fff;
      transition: background-color 0.3s ease;
    }

    .overlay button:hover {
      background-color: #e68900;
    }

    @media (max-width: 768px) {
      .feature-box {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <h1>Classic CS Algorithm Visualizer</h1>

  <div class="container">
    <div class="feature-box" style="background-image: url('bgimg1.png');">
      <div class="overlay">
        <h2>Sorting Visualizer</h2>
        <button onclick="location.href='index2.html'">Launch</button>
      </div>
    </div>

    <div class="feature-box" style="background-image: url('bgimg2.jpg');">
      <div class="overlay">
        <h2>CPU Scheduling Simulator</h2>
        <button onclick="location.href='index1.html'">Launch</button>
      </div>
    </div>
  </div>

</body>
</html>
